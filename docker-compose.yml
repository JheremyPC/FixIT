services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Local development only: reachable from this machine, not from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - fixit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    env_file: .env
    environment:
      # Local development always targets the local "db" service by default, even when .env
      # holds a production URL (e.g. Supabase). Set COMPOSE_DATABASE_URL to override explicitly.
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ML_MODEL_DIR: /srv/fixit/backend/ml_models
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - fixit-uploads:/srv/fixit/backend/uploads
      - fixit-ml-models:/srv/fixit/backend/ml_models
      - ./outputs:/srv/fixit/outputs
    command: >
      sh -c "alembic -c /srv/fixit/backend/alembic.ini upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-server-header"

volumes:
  fixit-postgres:
  fixit-uploads:
  fixit-ml-models:
