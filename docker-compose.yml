services:
  db:
    image: postgres:16-alpine
  environment:
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - fixit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - fixit-uploads:/srv/fixit/backend/uploads
    command: >
      sh -c "alembic -c /srv/fixit/backend/alembic.ini upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  fixit-postgres:
  fixit-uploads:
