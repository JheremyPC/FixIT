[alembic]
script_location = migrations
# Use the project backend directory as an import root when Alembic runs.
# Docker also sets this through PYTHONPATH, keeping CLI and container behavior equal.
prepend_sys_path = .
sqlalchemy.url = sqlite:///./fixit.db

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
